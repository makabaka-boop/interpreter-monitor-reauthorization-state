server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 安全上下文提示：麦克风 API 仅在 https 或 localhost 下可用。
    # 直接用 http://<宿主IP>:<WEB_PORT> 访问时，浏览器会禁用 getUserMedia，
    # 页面会明确显示“非安全上下文”原因；请改用 localhost 或 https 反代。
}
